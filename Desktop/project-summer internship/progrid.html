    <style>
        body{
            background-color: #173243;

        .wrapper{
           display: grid;
           grid-template-columns:repeat(4,150px);
           gap:10px;
           justify-content: center;
           align-content: center;
           height:100dvh;
        }
        .class{
            height: 150px;
            width:150px;
            background-color: aqua;
            border-radius: 10px;
        }

        .a{
            height:120px;
            background-color:#2e4351 ;

        }
         
        .clas > .a{
            height: 200px;
            background-color: rgb(111, 114, 255);
            border-radius: 10px;

        }
        .clas:nth-child(1){
            display:grid;
            grid-template-columns: repeat(1,150px);
            justify-content:center;
            align-content:start;
            background-color: #2e4351;
            border-radius: 10px;
            grid-row: span 2;
        }
        .class:nth-child(2){
            display:grid;
            grid-template-columns: repeat(1,150px);

            align-content:end;
            background-color:rgb(226, 113, 0);
        }
        .class:nth-child(3){
            display:grid;
            grid-template-columns: repeat(1,150px);

        .class:nth-child(4){
            display:grid;
            grid-template-columns: repeat(1,150px);

            grid-template-columns: repeat(1,150px);

            align-content:end;

            display:grid;
            grid-template-columns: repeat(1,150px);
            justify-content:center;
            align-content:end;
            background-color: rgb(150, 34, 200);
        }
        .class:nth-child(7){
            display:grid;
            grid-template-columns: repeat(1,150px);
            justify-content:center;
            align-content:end;
            background-color: rgb(236, 243, 42);
        }

    </style>
